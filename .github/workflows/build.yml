name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'   # 固定版本，保证编译器与运行时库一致
          cache: true

      - name: Build EXE
        run: go build -trimpath -ldflags="-s -w" -o zte-telnet.exe ./cmd/...

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: zte-telnet-windows
          path: zte-telnet.exe
          retention-days: 30
